[profile.release]
lto = true

[profile.release.package.anchor-cli]
codegen-units = 1

[workspace]
members = [
    "avm",
    "cli",
    "client",
    "idl",
    "lang",
    "lang/attribute/*",
    "lang/derive/*",
    "lang/syn",
    "spl",
]
exclude = [
    "tests/swap/deps/openbook-dex",
    "tests/cfo/deps/openbook-dex",
]
resolver = "2"

[workspace.dependencies]
jupnet-account-decoder = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-cli-config = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-client = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-faucet = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-program = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-program-test = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jupnet-sdk = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-associated-token-account = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-discriminator = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-memo = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-pod = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-tlv-account-resolution = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-token = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-token-2022 = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-token-group-interface = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-token-metadata-interface = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-transfer-hook-interface = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
jpl-type-length-value = { git = "https://github.com/jupnet/jupnet-svm.git", tag = "v1.1.3" }
