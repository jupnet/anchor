name: Tests

on:
  push:
    branches:
      - "jupnet/*"
    paths-ignore:
      - "docs/**"
  pull_request:
    branches:
      - "jupnet/*"
      - anchor-next
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  tests:
    name: Reusable
    uses: ./.github/workflows/reusable-tests.yaml
    with:
      cache: true
      solana_version: 3.1.10
      node_version: 22.22.3
      cargo_profile: debug
      anchor_binary_name: anchor-binary
      surfpool_cli_version: 1.2.0
